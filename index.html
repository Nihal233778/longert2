<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TADS Publisher Sandbox</title>
    
    <!-- Script 1: TADS Widget Loader -->
    <script src="https://w.tads.me/widget.js"></script>
    
    <style>
        :root {
            --bg-color: #f7f9fc;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #888888;
            --input-bg: #f0f2f5;
            --accent-blue: #2481cc;
            --accent-blue-hover: #1a5f99;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 15px;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Card Layout */
        .card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 5px;
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            background: var(--input-bg);
            border: 1px solid transparent;
            border-radius: 8px;
            font-size: 1rem;
            color: var(--text-main);
            box-sizing: border-box;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent-blue);
        }

        select.form-control {
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23888' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 10px center;
            background-size: 16px;
        }

        /* Primary Button Style */
        .btn-primary {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-blue);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 5px;
            margin-bottom: 15px;
        }

        .btn-primary:hover {
            background-color: var(--accent-blue-hover);
        }

        /* Ad Container Styling */
        #tads-container-9904 {
            min-height: 120px;
            background: #fafafa;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            border: 1px dashed #ccc;
            border-radius: 8px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <h1>✈️ TADS Publisher Sandbox</h1>

    <!-- ========================================== -->
    <!-- SECTION 1: Text-Graphic Block (TGB)        -->
    <!-- ========================================== -->
    <div class="card">
        
        <div class="form-group">
            <label>🆔 Widget ID</label>
            <input type="text" class="form-control" value="9904" readonly>
        </div>

        <div class="form-group">
            <label>📄 Ad Format</label>
            <select class="form-control" disabled>
                <option>Text-Graphic Block (TGB)</option>
            </select>
        </div>

        <div class="form-group">
            <label>🏆 Reward Type</label>
            <select class="form-control" disabled>
                <option>Rewarded (click/view reward)</option>
            </select>
        </div>

        <div class="form-group">
            <label>📝 Description</label>
            <textarea class="form-control" rows="2" readonly>Blog widget from dashboard #9904 – Personal blog (TGB)</textarea>
        </div>

        <!-- NEW: Button to trigger TGB Ad -->
        <button class="btn-primary" id="tgb_button_id">🚀 Show TGB Ad</button>

        <!-- The TGB Ad Container -->
        <div id="tads-container-9904">Ad will load here...</div>

        <!-- TGB Script (Using Widget ID 9904) - Unchanged -->
        <script>
            const adsNotFoundCallback = () => { 
                console.log('TGB: No ads found to show'); 
                document.getElementById('tads-container-9904').innerHTML = 'No TGB ads available right now.';
            };

            const onClickRewardCallback = (adId) => { 
                console.log('TGB: Clicked ad:', adId); 
            };

            document.addEventListener("DOMContentLoaded", function() {
                const adController = window.tads.init({
                    widgetId: 9904, 
                    type: 'static',
                    debug: false, 
                    onClickReward: onClickRewardCallback,
                    onAdsNotFound: adsNotFoundCallback
                });

                // We only load the ad when the button is clicked
                document.getElementById('tgb_button_id').addEventListener('click', () => {
                    document.getElementById('tads-container-9904').innerHTML = 'Loading Ad...';
                    
                    adController.loadAd()
                        .then(() => {
                            console.log("TGB: Ad loaded successfully. Showing now.");
                            adController.showAd();
                        })
                        .catch((err) => {
                            console.error("TGB Load Error:", err);
                            adsNotFoundCallback();
                        });
                });
            });
        </script>
    </div>

</body>
</html>
